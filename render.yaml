services:
  - type: web
    name: weather-aware-truck-routing-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 240
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: APP_VERSION
        value: 1.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: OPENROUTESERVICE_API_KEY
        sync: false
      - key: OPENROUTESERVICE_PROFILE
        value: driving-hgv
      - key: NOMINATIM_BASE_URL
        value: https://nominatim.openstreetmap.org/search
